---
layout: default
---
<article class="article">
  <header class="article-header">
    <a class="eyebrow back-link" href="{{ '/writing/' | relative_url }}">← Writing</a>
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="lede">{{ page.description }}</p>{% endif %}
    <p class="article-meta">{{ page.date | date: "%B %-d, %Y" }}{% if page.reading_time %} · {{ page.reading_time }} min read{% endif %}</p>
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
